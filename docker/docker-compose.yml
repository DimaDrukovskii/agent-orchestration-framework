services:
  app:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TENANT: ${TENANT:-climateplus}
    ports:
      - "8000:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8  # встроенный DNS Docker на хосте с плавающей сетью иногда не резолвит polza.ai
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - POLZA_API_KEY=${POLZA_API_KEY:-}
      - POLZA_BASE_URL=${POLZA_BASE_URL:-https://polza.ai/api/v1}
      - POLZA_MODEL=${POLZA_MODEL:-anthropic/claude-haiku-5.5}
      - LOCAL_BASE_URL=${LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_MODEL=${LOCAL_MODEL:-hermes3}
      - LOCAL_API_KEY=${LOCAL_API_KEY:-local}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - TTS_PROVIDER=${TTS_PROVIDER:-none}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_VOICE_ID=${TTS_VOICE_ID:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_STABILITY=${TTS_STABILITY:-0.45}
      - TTS_SIMILARITY=${TTS_SIMILARITY:-0.8}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-test-local-key}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CACHE_BACKEND=${CACHE_BACKEND:-sqlite}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      - REDIS_URL=redis://redis:6379
      - HERMES_AGENT_BASE_URL=${HERMES_AGENT_BASE_URL:-http://hermes:8642/v1}
      - HERMES_AGENT_API_KEY=${HERMES_API_KEY:-local-hermes-key-change-me-2026}
      - ASTERISK_MEDIA_PASSWORD=${ASTERISK_MEDIA_PASSWORD:-}
      - ASTERISK_ARI_URL=${ASTERISK_ARI_URL:-}
      - ASTERISK_ARI_USERNAME=${ASTERISK_ARI_USERNAME:-}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:-}
      - ASTERISK_TRANSFER_CONTEXT=${ASTERISK_TRANSFER_CONTEXT:-}
      - TELEPHONY_MODEL_PROFILE=${TELEPHONY_MODEL_PROFILE:-default}
      - TELEPHONY_ENABLED=${TELEPHONY_ENABLED:-false}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - SIMULATOR_USE_HERMES=${SIMULATOR_USE_HERMES:-false}
      - CALLBACK_SIMULATOR_ENABLED=${CALLBACK_SIMULATOR_ENABLED:-false}
      - CALLBACK_SIMULATOR_OUTCOME=${CALLBACK_SIMULATOR_OUTCOME:-answered}
      - CALLBACK_START_HOUR=${CALLBACK_START_HOUR:-9}
      - CALLBACK_END_HOUR=${CALLBACK_END_HOUR:-20}
      - CALLBACK_MAX_ATTEMPTS=${CALLBACK_MAX_ATTEMPTS:-3}
      - CALLBACK_RETRY_SECONDS=${CALLBACK_RETRY_SECONDS:-300}
      - TENANT=${TENANT:-climateplus}
    depends_on:
      - redis
    volumes:
      - ../src:/app/src
      - ../demo:/app/demo
      - ../data:/app/data
      - ../tenants/${TENANT:-climateplus}:/app/tenants/${TENANT:-climateplus}:ro

  # Hermes Agent (Nous Research) как «мозг» звонка: профиль model_profile="hermes_agent". Не запускается
  # по умолчанию: docker compose --profile hermes up -d. Порт только на localhost хоста: агент умеет
  # выполнять команды внутри своего контейнера, наружу его выставлять нельзя. MCP-инструменты
  # подключаются в его собственном config.yaml (docs/website_side_bar/LLM_CONNECTOR.md).
  hermes:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["hermes"]
    build:
      context: ./hermes
    init: true
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - POLZA_API_KEY=${POLZA_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-${POLZA_MODEL:-anthropic/claude-haiku-5.5}}
      - HERMES_MODEL_BASE_URL=${HERMES_MODEL_BASE_URL:-https://polza.ai/api/v1}
      - HERMES_MODEL_API_KEY=${HERMES_MODEL_API_KEY:-}
      - HERMES_CONTEXT_LENGTH=${HERMES_CONTEXT_LENGTH:-200000}
      - API_SERVER_KEY=${HERMES_API_KEY:-local-hermes-key-change-me-2026}
      - HERMES_MCP_CONFIG=${HERMES_MCP_CONFIG-/project/appointments.yaml}
    volumes:
      - ../src:/project/src:ro
      - ../tenants/climateplus:/project/tenants/climateplus:ro
      - ./hermes/appointments.yaml:/project/appointments.yaml:ro
      - hermes_data:/home/hermes/.hermes

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  hermes_data:
  redis_data:
