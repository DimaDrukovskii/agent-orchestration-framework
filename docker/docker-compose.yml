version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - POLZA_API_KEY=${POLZA_API_KEY:-}
      - POLZA_BASE_URL=${POLZA_BASE_URL:-https://polza.ai/api/v1}
      - POLZA_MODEL=${POLZA_MODEL:-anthropic/claude-sonnet-4}
      - HERMES_AGENT_BASE_URL=${HERMES_AGENT_BASE_URL:-http://hermes:8642/v1}
      - HERMES_AGENT_API_KEY=${HERMES_API_KEY:-local-hermes-key-change-me-2026}
      - LOCAL_BASE_URL=${LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_MODEL=${LOCAL_MODEL:-hermes3}
      - LOCAL_API_KEY=${LOCAL_API_KEY:-local}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - TTS_PROVIDER=${TTS_PROVIDER:-none}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_VOICE_ID=${TTS_VOICE_ID:-}
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_STABILITY=${TTS_STABILITY:-0.45}
      - TTS_SIMILARITY=${TTS_SIMILARITY:-0.8}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-test-local-key}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CACHE_BACKEND=${CACHE_BACKEND:-sqlite}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ../src:/app/src
      - ../demo:/app/demo
      - ../data:/app/data
      - ../tenants:/app/tenants
    command: uvicorn src.main:app --host 0.0.0.0 --reload

  # Настоящий Hermes Agent (Nous Research): «мозг» Алины по профилю hermes_agent.
  # Порт открыт только на localhost хоста; агент умеет выполнять команды внутри
  # своего контейнера, наружу его выставлять нельзя.
  hermes:
    build:
      context: ./hermes
    init: true
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - POLZA_API_KEY=${POLZA_API_KEY:-}
      - HERMES_MODEL=${POLZA_MODEL:-anthropic/claude-sonnet-4}
      - API_SERVER_KEY=${HERMES_API_KEY:-local-hermes-key-change-me-2026}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
