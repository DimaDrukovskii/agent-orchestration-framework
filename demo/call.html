<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Звонок · МТС AI-Agent</title>
    <style>
      :root {
        --color-page: #f6f5f3;
        --color-card: #ffffff;
        --color-ink: #0b0b0c;
        --color-ink-soft: #5b5b63;
        --color-line: #e8e6e2;
        --color-chip: #f1efec;
        --color-chip-hover: #e8e5e0;
        --color-live: #1fa85b;
        --color-warn-bg: #fdf3d8;
        --color-warn-text: #7a5a00;
        --shadow-card: 0 24px 60px rgba(20, 16, 12, 0.16), 0 2px 8px rgba(20, 16, 12, 0.06);

        --duration-fast: 150ms;
        --duration-normal: 300ms;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-page: #0e0e10;
          --color-card: #1a1a1d;
          --color-ink: #f4f4f6;
          --color-ink-soft: #9b9ba6;
          --color-line: #2a2a2f;
          --color-chip: #26262b;
          --color-chip-hover: #303036;
          --color-warn-bg: #3a2f12;
          --color-warn-text: #f5d68a;
          --shadow-card: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        background: var(--color-page);
        color: var(--color-ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      /* встроенный режим (?embed=1): прозрачный фон, без заглушки, виджет у края iframe */
      .embed body {
        min-height: 0;
        background: transparent;
      }

      .embed .demo-note {
        display: none;
      }

      .embed .widget {
        right: 40px; /* запас под тень, чтобы край iframe её не обрезал */
        bottom: 40px;
        left: auto;
      }

      .embed .card {
        width: 340px; /* ширину iframe родитель подгоняет под виджет, а не наоборот */
      }

      .demo-note {
        max-width: 420px;
        margin: 18vh auto 0;
        padding: 0 20px;
        text-align: center;
        font-size: 15px;
        line-height: 1.5;
        color: var(--color-ink-soft);
      }

      .demo-note a {
        color: var(--color-ink);
      }

      /* --- виджет: правый нижний угол --------------------------------- */
      .widget {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1000;
      }

      .launcher {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 20px 0 10px;
        border: none;
        border-radius: 999px;
        background: var(--color-card);
        color: var(--color-ink);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        transition: transform var(--duration-fast) var(--ease-out);
      }

      .launcher:hover {
        transform: translateY(-2px);
      }

      .launcher .orb {
        --orb: 34px;
      }

      .widget[data-open="true"] .launcher,
      .widget[data-open="false"] .card {
        display: none;
      }

      .card {
        width: 340px;
        padding: 16px 18px 18px;
        border-radius: 28px;
        background: var(--color-card);
        box-shadow: var(--shadow-card);
        animation: card-in var(--duration-normal) var(--ease-out);
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .who-name {
        font-size: 14px;
        font-weight: 600;
      }

      .who-sub {
        font-size: 12px;
        color: var(--color-ink-soft);
      }

      .head-actions {
        display: flex;
        gap: 4px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--color-ink-soft);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background var(--duration-fast);
      }

      .icon-btn:hover {
        background: var(--color-chip);
        color: var(--color-ink);
      }

      .icon-btn svg,
      .btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--color-ink);
        outline-offset: 2px;
      }

      /* --- шар в стиле ElevenLabs ------------------------------------- */
      .orb {
        --orb: 124px;
        --level: 0;
        --drift: 12s;
        position: relative;
        flex-shrink: 0;
        width: var(--orb);
        height: var(--orb);
        border-radius: 50%;
        overflow: hidden;
        isolation: isolate;
        background: #f3dccf;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.5),
          0 12px 32px rgba(227, 6, 17, 0.2);
        transform: scale(calc(1 + var(--level) * 0.16));
        transition: transform 80ms linear;
      }

      .blob {
        position: absolute;
        width: 78%;
        height: 78%;
        border-radius: 50%;
        filter: blur(calc(var(--orb) * 0.11));
        animation: drift var(--drift) ease-in-out infinite alternate;
      }

      .blob:nth-child(1) {
        background: #ff7a59;
        left: -12%;
        top: -8%;
      }

      .blob:nth-child(2) {
        background: #e30611;
        right: -18%;
        top: 18%;
        animation-delay: -3s;
        animation-direction: alternate-reverse;
      }

      .blob:nth-child(3) {
        background: #ffc27a;
        left: 14%;
        bottom: -24%;
        animation-delay: -6s;
      }

      .blob:nth-child(4) {
        background: #b98cff;
        right: 2%;
        bottom: -12%;
        opacity: 0.85;
        animation-delay: -9s;
        animation-direction: alternate-reverse;
      }

      .orb::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.22;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      .orb::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.55), transparent 48%);
      }

      @keyframes drift {
        0% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        50% {
          transform: translate(22%, -14%) rotate(120deg) scale(1.12);
        }
        100% {
          transform: translate(-14%, 18%) rotate(240deg) scale(0.94);
        }
      }

      .widget[data-phase="idle"] .orb,
      .widget[data-phase="ended"] .orb {
        --drift: 16s;
      }

      .widget[data-phase="connecting"] .orb,
      .widget[data-phase="thinking"] .orb {
        --drift: 3s;
      }

      .widget[data-phase="listening"] .orb {
        --drift: 9s;
      }

      .widget[data-phase="speaking"] .orb {
        --drift: 5s;
      }

      .widget[data-muted="true"] .orb {
        filter: grayscale(0.85);
      }

      /* когда голос идёт с сервера, орб пульсирует по реальной громкости;
         с браузерным голосом громкость недоступна — лёгкое дыхание */
      .widget[data-phase="speaking"][data-level="sim"] .orb {
        animation: breathe 0.8s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      /* --- тело карточки ----------------------------------------------- */
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 18px 0 14px;
        text-align: center;
      }


      .status {
        font-size: 16px;
        font-weight: 600;
      }

      .timer {
        min-height: 18px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-soft);
      }

      .caption {
        width: 100%;
        min-height: 62px;
        margin-top: 6px;
        font-size: 14px;
        line-height: 1.45;
        color: var(--color-ink-soft);
      }

      .caption[hidden] {
        visibility: hidden;
        display: block;
      }

      .caption-who {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .caption-text {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--color-ink);
      }

      /* лента диалога: и голос, и текст попадают сюда */
      .chat {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 96px;
        max-height: 190px;
        margin-bottom: 12px;
        overflow-y: auto;
      }

      .chat-msg {
        max-width: 88%;
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .chat-msg.from-agent {
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        background: var(--color-chip);
        color: var(--color-ink);
      }

      .chat-msg.from-user {
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        background: var(--color-ink);
        color: var(--color-card);
      }

      .chat-link {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 1px solid var(--color-ink);
        border-radius: 999px;
        color: var(--color-ink);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .chat-link:hover {
        background: var(--color-ink);
        color: var(--color-card);
      }

      .chat-msg.pending {
        opacity: 0.55;
      }

      .orb-wrap {
        position: relative;
        margin-bottom: 14px;
      }

      .stage .orb {
        --orb: 104px;
        margin-bottom: 0;
      }

      /* кнопка звонка по центру круга, как в ElevenLabs */
      .btn.btn-start {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        flex: none;
        width: 46px;
        height: 46px;
        padding: 0;
        transform: translate(-50%, -50%);
        background: #fff;
        color: #14161a;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }

      .btn.btn-start:hover {
        transform: translate(-50%, -50%) scale(1.07);
      }

      .btn.btn-start:active {
        transform: translate(-50%, -50%) scale(0.95);
      }

      .caption,
      .caption[hidden] {
        display: none; /* текущая реплика теперь видна в ленте диалога */
      }

      .widget[data-phase="idle"] .controls,
      .widget[data-phase="ended"] .controls {
        display: none;
      }

      .composer {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .composer input {
        flex: 1;
        min-width: 0;
        height: 42px;
        padding: 0 16px;
        border: 1px solid var(--color-line);
        border-radius: 999px;
        background: transparent;
        color: var(--color-ink);
        font: inherit;
        font-size: 14px;
      }

      .composer input::placeholder {
        color: var(--color-ink-soft);
      }

      .composer input:focus-visible {
        outline: 2px solid var(--color-ink);
        outline-offset: 1px;
      }

      .send-btn {
        flex: none;
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: var(--color-ink);
        color: var(--color-card);
        cursor: pointer;
      }

      .send-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .notice {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--color-warn-bg);
        color: var(--color-warn-text);
        font-size: 12px;
        line-height: 1.45;
      }

      .notice[hidden] {
        display: none;
      }

      .notice code {
        font-size: 11px;
        word-break: break-all;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .btn {
        height: 46px;
        border: none;
        border-radius: 999px;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .btn-start,
      .btn-end {
        flex: 1;
        background: var(--color-ink);
        color: var(--color-card);
      }

      .btn-end svg {
        transform: rotate(135deg);
      }

      .btn-mute {
        width: 46px;
        padding: 0;
        background: var(--color-chip);
        color: var(--color-ink);
      }

      .btn-mute:hover {
        background: var(--color-chip-hover);
      }

      .btn-mute[aria-pressed="true"] {
        background: var(--color-ink);
        color: var(--color-card);
      }

      .mute-slash {
        display: none;
      }

      .btn-mute[aria-pressed="true"] .mute-slash {
        display: inline;
      }

      .widget[data-phase="idle"] .btn-start,
      .widget[data-phase="ended"] .btn-start,
      .widget[data-phase="connecting"] .btn-end,
      .widget[data-phase="listening"] .btn-end,
      .widget[data-phase="thinking"] .btn-end,
      .widget[data-phase="speaking"] .btn-end,
      .widget[data-phase="listening"] .btn-mute,
      .widget[data-phase="thinking"] .btn-mute,
      .widget[data-phase="speaking"] .btn-mute {
        display: inline-flex;
      }

      /* --- настройки --------------------------------------------------- */
      .settings {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--color-line);
        font-size: 12px;
        color: var(--color-ink-soft);
      }

      .settings[hidden] {
        display: none;
      }

      .settings label {
        display: block;
        margin-top: 8px;
      }

      .settings select,
      .settings input {
        width: 100%;
        margin-top: 4px;
        border: 1px solid var(--color-line);
        border-radius: 10px;
        background: var(--color-page);
        color: var(--color-ink);
        padding: 8px 10px;
        font-size: 13px;
      }

      .voice-mode {
        margin-top: 2px;
        color: var(--color-ink);
      }

      @media (max-width: 480px) {
        .widget {
          right: 12px;
          bottom: 12px;
          left: 12px;
        }

        .card {
          width: auto;
        }

        .launcher {
          margin-left: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .blob,
        .card,
        .orb {
          animation: none !important;
        }
      }
    </style>
      <script>
      if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");
    </script>
  </head>
  <body>
    <p class="demo-note">
      Демо звонка. Виджет — в правом нижнем углу.<br />
      <a href="/demo/index.html">← На главную</a>
    </p>

    <aside class="widget" id="widget" data-open="false" data-phase="idle" data-muted="false" data-level="sim">
      <button class="launcher" id="launcher" type="button" aria-label="Открыть звонок с агентом">
        <span class="orb" aria-hidden="true">
          <i class="blob"></i><i class="blob"></i><i class="blob"></i><i class="blob"></i>
        </span>
        <span id="launcherText">Поговорить с Алиной</span>
      </button>

      <section class="card" role="dialog" aria-label="Звонок агенту МТС">
        <header class="card-head">
          <div>
            <div class="who-name" id="whoName">Алина · МТС</div>
            <div class="who-sub" id="whoSub">ИИ-ассистент поддержки</div>
          </div>
          <div class="head-actions">
            <button class="icon-btn" id="settingsBtn" type="button" aria-label="Настройки" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>
            <button class="icon-btn" id="minimizeBtn" type="button" aria-label="Свернуть">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" /></svg>
            </button>
          </div>
        </header>

        <div class="stage" aria-live="polite">
          <div class="orb-wrap">
            <div class="orb" aria-hidden="true">
              <i class="blob"></i><i class="blob"></i><i class="blob"></i><i class="blob"></i>
            </div>
            <button class="btn btn-start" id="startBtn" type="button" aria-label="Начать звонок">
              <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            </button>
          </div>
          <p class="status" id="status">Готовы поговорить?</p>
          <p class="timer" id="timer"></p>
          <div class="caption" id="caption" hidden>
            <span class="caption-who" id="captionWho"></span>
            <span class="caption-text" id="captionText"></span>
          </div>
        </div>

        <div class="chat" id="chat" role="log" aria-live="polite" aria-label="Диалог">
          <div class="chat-msg from-agent" id="welcomeMsg">Здравствуйте! Я Алина, ИИ-ассистент МТС. Спросите про тарифы, услуги или роуминг: голосом или текстом.</div>
        </div>

        <div class="notice" id="notice" hidden></div>

        <div class="controls">
          <button class="btn btn-mute" id="muteBtn" type="button" aria-pressed="false" aria-label="Выключить микрофон">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line class="mute-slash" x1="3" y1="3" x2="21" y2="21" />
            </svg>
          </button>
          <button class="btn btn-end" id="endBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            Завершить
          </button>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <input id="textInput" type="text" placeholder="Или напишите сообщение…" maxlength="500" aria-label="Сообщение" />
          <button class="send-btn" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>
          </button>
        </form>

        <div class="settings" id="settings" hidden>
          <div>Голос: <span class="voice-mode" id="voiceMode">проверяю…</span></div>
          <label>
            Модель агента
            <select id="modelSelect"></select>
          </label>
          <label>
            Резервный голос браузера
            <select id="voiceSelect"></select>
          </label>
          <label>
            API-ключ (X-API-Key)
            <input id="apiKeyInput" type="text" autocomplete="off" />
          </label>
        </div>
      </section>
    </aside>

    <script>
      "use strict";

      // --- конфиг ---------------------------------------------------------
      const EMBED = document.documentElement.classList.contains("embed");
      const API_URL = "/api/hermes/dialog";
      const TTS_URL = "/api/tts";
      const TTS_STATUS_URL = "/api/tts/status";
      const LLM_STATUS_URL = "/api/llm/status";
      const CALLER_PHONE = "+79990000000";
      const DEFAULT_API_KEY = "test-local-key";
      const CONNECT_DELAY_MS = 2200;
      const REQUEST_TIMEOUT_MS = 35000;
      const STATUS_TIMEOUT_MS = 4000;
      const LISTEN_RESUME_DELAY_MS = 350; // даём затихнуть эху динамиков
      const LISTEN_RETRY_DELAY_MS = 250;
      const NETWORK_RETRY_DELAY_MS = 1500;
      const MAX_RECOGNITION_FAILURES = 4;
      const MAX_AGENT_FAILURES = 3;
      const MAX_CHUNK_CHARS = 180; // короткие куски: быстрее первый звук и мягче расход кредитов
      const BROWSER_SPEECH_RATE = 1.05;
      // перебивание: пока Алина говорит, слушаем микрофон; ?barge=0 в адресе — выключить
      const BARGE_IN_ENABLED = new URLSearchParams(location.search).get("barge") !== "0";
      const BARGE_MIN_CHARS = 10; // короче или одно слово — считаем шумом или эхом
      const BARGE_MIN_WORDS = 2;
      const BARGE_ECHO_RATIO = 0.4; // столько слов совпало с речью Алины — это эхо динамиков, а не абонент
      const BARGE_FINISH_TIMEOUT_MS = 7000; // после перебивания дослушиваем не дольше этого
      const BARGE_RESTART_DELAY_MS = 200;
      // Chrome оценивает уверенность распознавания (0..1); ниже порога модель переспросит, как живой оператор
      const CONFIDENCE_MIN = 0.75;
      const UNCERTAIN_MARK = "[неуверенно распознано] ";
      // серверное распознавание (/api/stt, gpt-4o-transcribe): запись с шумоподавлением и
      // «воротами» по громкости; конец фразы — по паузе. ?stt=browser — вернуть браузерное
      const STT_URL = "/api/stt";
      const STT_STATUS_URL = "/api/stt/status";
      const STT_FORCE_BROWSER = new URLSearchParams(location.search).get("stt") === "browser";
      const VAD_CALIBRATE_MS = 500; // фон меряем в начале звонка, порог = фон * VAD_FACTOR
      const VAD_MIN_LEVEL = 0.012;
      const VAD_FACTOR = 2.5;
      const VAD_HOLD_MS = 350; // ворота закрываются не сразу, чтобы не резать концы слов
      const VAD_POLL_MS = 30;
      const VAD_END_SILENCE_MS = 900; // столько тишины после речи = фраза закончена
      const VAD_MIN_SPEECH_MS = 300; // короче — кашель или щелчок, не отправляем
      const VAD_MAX_UTTERANCE_MS = 20000;
      const VAD_IDLE_RESTART_MS = 15000; // долго молчат — перезапускаем запись, чтобы она не росла
      const STT_MIN_CHARS = 2;
      const LEVEL_SMOOTHING = 0.35;
      const LEVEL_GAIN = 4;
      // подписи по умолчанию; настоящие приходят с сервера (GET /api/tenant, файл tenants/<клиент>/tenant.json)
      let GREETING = "Здравствуйте, менеджер Алина от компании МТС, слушаю.";
      let LAUNCHER_TEXT = "Поговорить с Алиной";
      // ошибки ключа повторять бессмысленно: сразу объясняем, а не «связь пропала» три раза
      const FATAL_AGENT_ERRORS = {
        model_not_allowed: "Модель агента не разрешена на ключе Polza (403). Разрешите её в настройках ключа и позвоните снова.",
        insufficient_balance: "У ключа Polza закончился лимит (402). Поднимите лимит или дождитесь сброса и позвоните снова.",
      };
      const FALLBACK_REPLY = "Извините, связь на секунду пропала. Повторите, пожалуйста.";

      const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
      const AudioContextImpl = window.AudioContext || window.webkitAudioContext;
      const synth = window.speechSynthesis;

      // --- элементы -------------------------------------------------------
      const $ = (id) => document.getElementById(id);
      const widget = $("widget");
      const statusEl = $("status");
      const timerEl = $("timer");
      const captionEl = $("caption");
      const captionWho = $("captionWho");
      const captionText = $("captionText");
      const noticeEl = $("notice");
      const chatEl = $("chat");
      const launcherText = $("launcherText");
      const startBtn = $("startBtn");
      const endBtn = $("endBtn");
      const muteBtn = $("muteBtn");
      const settingsBtn = $("settingsBtn");
      const settingsEl = $("settings");
      const voiceSelect = $("voiceSelect");
      const modelSelect = $("modelSelect");
      const voiceModeEl = $("voiceMode");
      const keyInput = $("apiKeyInput");

      const STATUS_TEXT = {
        idle: "Готовы поговорить?",
        connecting: "Соединяем…",
        listening: "Слушаю вас",
        thinking: "Думаю…",
        speaking: "Говорит Алина",
        ended: "Звонок завершён",
      };

      // --- состояние ------------------------------------------------------
      let call = null; // активный звонок или null
      const widgetSessionId = newSessionId(); // один разговор: текст и голос продолжают друг друга
      let recognition = null;
      let voices = [];
      let selectedVoiceURI = storeGet("mts_call_voice");
      let serverVoiceAvailable = false;
      const MODEL_PROFILES = ["default", "local", "hermes_agent"];
      let modelProfile = MODEL_PROFILES.includes(storeGet("mts_model_profile")) ? storeGet("mts_model_profile") : "default";

      // --- хранилище (может быть недоступно) ------------------------------
      function storeGet(key) {
        try {
          return sessionStorage.getItem(key) || "";
        } catch (e) {
          return "";
        }
      }

      function storeSet(key, value) {
        try {
          sessionStorage.setItem(key, value);
        } catch (e) {}
      }

      keyInput.value = storeGet("mts_api_key") || DEFAULT_API_KEY;
      keyInput.addEventListener("change", () => {
        storeSet("mts_api_key", keyInput.value.trim());
        loadTenant();
        checkServerVoice();
        checkModels();
      });

      const apiHeaders = () => ({ "Content-Type": "application/json", "X-API-Key": keyInput.value.trim() });
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // --- UI-хелперы -----------------------------------------------------
      function setOpen(open) {
        widget.dataset.open = String(open);
      }

      function setPhase(phase) {
        widget.dataset.phase = phase;
        statusEl.textContent = call && call.muted && phase === "listening" ? "Микрофон выключен" : STATUS_TEXT[phase];
        if (!call) launcherText.textContent = LAUNCHER_TEXT;
      }

      function showCaption(who, text) {
        captionEl.hidden = !text;
        captionWho.textContent = who;
        captionText.textContent = text;
      }

      // лента диалога: реплики голосом и текстом показываются здесь же; возвращает элемент пузыря
      function addMessage(role, text) {
        const bubble = document.createElement("div");
        bubble.className = "chat-msg " + (role === "user" ? "from-user" : "from-agent");
        bubble.textContent = text;
        chatEl.appendChild(bubble);
        chatEl.scrollTop = chatEl.scrollHeight;
        return bubble;
      }

      async function loadTenant() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), STATUS_TIMEOUT_MS);
        try {
          const response = await fetch("/api/tenant", { headers: apiHeaders(), signal: controller.signal });
          if (!response.ok) return;
          const t = await response.json();
          const name = t.company ? t.agent_name + " · " + t.company : t.agent_name;
          $("whoName").textContent = name;
          $("whoSub").textContent = t.subtitle;
          $("welcomeMsg").textContent = t.welcome;
          document.querySelector(".card").setAttribute("aria-label", "Звонок: " + name);
          GREETING = t.greeting;
          LAUNCHER_TEXT = t.launcher_text;
          if (!call) launcherText.textContent = LAUNCHER_TEXT;
        } catch (e) {
          // остаются подписи по умолчанию из этого файла
        } finally {
          clearTimeout(timeout);
        }
      }

      // агент показывает раздел сайта: кнопка-ссылка в ленте (только https, откроется в новой вкладке)
      function addLinks(links) {
        for (const item of links) {
          if (!item || typeof item.url !== "string" || !item.url.startsWith("https://")) continue;
          const link = document.createElement("a");
          link.className = "chat-link";
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = (item.title || "Открыть") + " ↗";
          chatEl.appendChild(link);
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function showNotice(html) {
        noticeEl.hidden = !html;
        noticeEl.innerHTML = html || ""; // только статические строки из этого файла
      }

      function formatDuration(totalSeconds) {
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const s = String(totalSeconds % 60).padStart(2, "0");
        return m + ":" + s;
      }

      function startTimer(activeCall) {
        activeCall.startedAt = Date.now();
        const tick = () => {
          const text = formatDuration(Math.floor((Date.now() - activeCall.startedAt) / 1000));
          timerEl.textContent = text;
          launcherText.textContent = "На связи " + text;
        };
        tick();
        activeCall.timerId = setInterval(tick, 1000);
      }

      function setLevel(value) {
        widget.querySelectorAll(".orb").forEach((orb) => orb.style.setProperty("--level", value.toFixed(3)));
      }

      function isActive(activeCall) {
        return call !== null && call === activeCall && !activeCall.ended;
      }

      // --- окружение ------------------------------------------------------
      function checkEnvironment() {
        if (!SpeechRecognitionImpl) {
          showNotice("Этот браузер не поддерживает распознавание речи. Откройте страницу в Chrome или Edge.");
          startBtn.disabled = true;
          return false;
        }
        if (!window.isSecureContext) {
          showNotice(
            "Страница открыта по небезопасному адресу — браузер заблокирует микрофон. " +
              "Откройте <code>http://localhost:" + (location.port || "8000") + "/demo/call.html</code> " +
              "или в Chrome добавьте <code>" + location.origin + "</code> в " +
              "<code>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code> и перезапустите браузер."
          );
          return false;
        }
        return true;
      }

      async function checkServerVoice() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), STATUS_TIMEOUT_MS);
        try {
          const response = await fetch(TTS_STATUS_URL, { headers: apiHeaders(), signal: controller.signal });
          serverVoiceAvailable = response.ok && (await response.json()).enabled === true;
        } catch (e) {
          serverVoiceAvailable = false;
        } finally {
          clearTimeout(timeout);
        }
        voiceModeEl.textContent = serverVoiceAvailable ? "серверный (живой)" : "браузерный (резервный, роботизированный)";
        return serverVoiceAvailable;
      }

      // --- выбор модели агента ---------------------------------------------
      function setModelOptions(status) {
        const defaultOpt = new Option("Облако — " + status.default.model, "default");
        const localOpt = new Option(
          "Локальная — " + status.local.model + (status.local.available ? "" : " (сервер не запущен)"),
          "local"
        );
        localOpt.disabled = !status.local.available;
        const hermes = status.hermes_agent || { available: false, model: "hermes-agent" };
        const hermesOpt = new Option(
          "Hermes Agent — " + hermes.model + (hermes.available ? "" : " (контейнер не запущен)"),
          "hermes_agent"
        );
        hermesOpt.disabled = !hermes.available;
        modelSelect.replaceChildren(defaultOpt, hermesOpt, localOpt);
        if (modelProfile === "local" && !status.local.available) modelProfile = "default";
        if (modelProfile === "hermes_agent" && !hermes.available) modelProfile = "default";
        modelSelect.value = modelProfile;
      }

      async function checkModels() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), STATUS_TIMEOUT_MS);
        try {
          const response = await fetch(LLM_STATUS_URL, { headers: apiHeaders(), signal: controller.signal });
          if (response.ok) setModelOptions(await response.json());
        } catch (e) {
          // статус недоступен — оставляем облако, звонок это не ломает
        } finally {
          clearTimeout(timeout);
        }
      }

      modelSelect.addEventListener("change", () => {
        modelProfile = MODEL_PROFILES.includes(modelSelect.value) ? modelSelect.value : "default";
        storeSet("mts_model_profile", modelProfile);
      });

      // --- резервные голоса браузера --------------------------------------
      function voiceScore(v) {
        let score = 0;
        if (/premium|enhanced|neural|natural/i.test(v.name)) score += 4;
        if (/milena|yuri|alena|katya|google|yandex/i.test(v.name)) score += 2;
        if (!v.localService) score += 1;
        return score;
      }

      function loadVoices() {
        if (!synth) return;
        voices = synth
          .getVoices()
          .filter((v) => v.lang.toLowerCase().startsWith("ru"))
          .sort((a, b) => voiceScore(b) - voiceScore(a));
        voiceSelect.replaceChildren(
          ...voices.map((v) => {
            const opt = document.createElement("option");
            opt.value = v.voiceURI;
            opt.textContent = v.name;
            return opt;
          })
        );
        if (!voices.length) {
          const opt = document.createElement("option");
          opt.textContent = "Русский голос не найден";
          voiceSelect.replaceChildren(opt);
          return;
        }
        const chosen = voices.find((v) => v.voiceURI === selectedVoiceURI) || voices[0];
        selectedVoiceURI = chosen.voiceURI;
        voiceSelect.value = chosen.voiceURI;
      }

      voiceSelect.addEventListener("change", () => {
        selectedVoiceURI = voiceSelect.value;
        storeSet("mts_call_voice", selectedVoiceURI);
      });

      if (synth) {
        loadVoices();
        synth.addEventListener("voiceschanged", loadVoices);
      }

      // --- озвучка --------------------------------------------------------
      function splitForSpeech(text) {
        const clean = text.replace(/[*_#`>]/g, "").replace(/\s+/g, " ").trim();
        const sentences = clean.match(/[^.!?…]+[.!?…]*\s*/g) || [clean];
        const chunks = [];
        let buffer = "";
        for (const sentence of sentences) {
          if (buffer && (buffer + sentence).length > MAX_CHUNK_CHARS) {
            chunks.push(buffer.trim());
            buffer = "";
          }
          buffer += sentence;
        }
        if (buffer.trim()) chunks.push(buffer.trim());
        return chunks;
      }

      // серверный голос: текст -> /api/tts -> mp3 -> декодирование. null = не вышло.
      async function fetchSpeech(activeCall, chunk) {
        try {
          const response = await fetch(TTS_URL, {
            method: "POST",
            headers: apiHeaders(),
            body: JSON.stringify({ text: chunk }),
            signal: activeCall.abort.signal,
          });
          if (!response.ok) throw new Error("tts " + response.status);
          return await activeCall.audio.decodeAudioData(await response.arrayBuffer());
        } catch (e) {
          if (!isActive(activeCall)) return null;
          if (activeCall.voice === "server") {
            activeCall.voice = "browser";
            showNotice("Серверный голос недоступен — говорю голосом браузера.");
          }
          return null;
        }
      }

      function playBuffer(activeCall, buffer) {
        return new Promise((resolve) => {
          const { audio, analyser } = activeCall;
          const source = audio.createBufferSource();
          source.buffer = buffer;
          source.connect(analyser);
          analyser.connect(audio.destination);
          activeCall.source = source;
          widget.dataset.level = "live";

          const samples = new Uint8Array(analyser.fftSize);
          let smoothed = 0;
          let frame = 0;
          const measure = () => {
            analyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (const s of samples) sum += ((s - 128) / 128) ** 2;
            smoothed += (Math.min(1, Math.sqrt(sum / samples.length) * LEVEL_GAIN) - smoothed) * LEVEL_SMOOTHING;
            setLevel(smoothed);
            frame = requestAnimationFrame(measure);
          };
          frame = requestAnimationFrame(measure);

          source.onended = () => {
            cancelAnimationFrame(frame);
            setLevel(0);
            widget.dataset.level = "sim";
            activeCall.source = null;
            resolve();
          };
          source.start();
        });
      }

      function speakWithBrowser(chunk) {
        return new Promise((resolve) => {
          if (!synth) return resolve();
          const utter = new SpeechSynthesisUtterance(chunk);
          utter.lang = "ru-RU";
          utter.rate = BROWSER_SPEECH_RATE;
          const voice = voices.find((v) => v.voiceURI === selectedVoiceURI);
          if (voice) utter.voice = voice;
          // в Chrome onend иногда не приходит — страхуемся таймером
          const guard = setTimeout(resolve, Math.max(5000, chunk.length * 160));
          const done = () => {
            clearTimeout(guard);
            resolve();
          };
          utter.onend = done;
          utter.onerror = done;
          synth.speak(utter);
        });
      }

      function stopPlayback(activeCall) {
        if (activeCall.source) {
          try {
            activeCall.source.stop();
          } catch (e) {}
        }
        if (synth) synth.cancel();
      }

      // слова, услышанные микрофоном, почти целиком совпадают с речью Алины — это её эхо
      function isEcho(heard, spoken) {
        const words = (s) => s.toLowerCase().replace(/[^а-яёa-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
        const heardWords = words(heard);
        if (!heardWords.length) return true;
        const spokenSet = new Set(words(spoken));
        const hits = heardWords.filter((w) => spokenSet.has(w)).length;
        return hits / heardWords.length >= BARGE_ECHO_RATIO;
      }

      // Слушаем абонента, пока говорит Алина. Заговорил — Алина замолкает, а это же
      // распознавание дослушивает фразу и передаёт её агенту (см. onend).
      function startBargeIn(activeCall, spokenText) {
        if (!BARGE_IN_ENABLED || activeCall.muted || !isActive(activeCall)) return;
        teardownRecognition();
        activeCall.bargeActive = true;

        const rec = new SpeechRecognitionImpl();
        rec.lang = "ru-RU";
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;
        recognition = rec;

        let triggered = false;
        let finalText = "";
        let minConfidence = 1;

        rec.onresult = (event) => {
          let heard = "";
          finalText = "";
          minConfidence = 1;
          for (let i = 0; i < event.results.length; i++) {
            heard += event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalText += event.results[i][0].transcript;
              if (event.results[i][0].confidence > 0) {
                minConfidence = Math.min(minConfidence, event.results[i][0].confidence);
              }
            }
          }
          if (!triggered) {
            const wordCount = heard.trim().split(/\s+/).filter(Boolean).length;
            if (heard.trim().length < BARGE_MIN_CHARS || wordCount < BARGE_MIN_WORDS || isEcho(heard, spokenText)) return;
            triggered = true;
            activeCall.interrupted = true;
            stopPlayback(activeCall);
            setPhase("listening");
            // Chrome иногда не закрывает распознавание сам — без этого звонок «замирает»
            setTimeout(() => {
              if (rec === recognition) {
                try {
                  rec.stop();
                } catch (e) {}
              }
            }, BARGE_FINISH_TIMEOUT_MS);
          }
          showCaption("Вы", heard.trim());
        };

        rec.onerror = () => {};

        rec.onend = () => {
          if (rec !== recognition) return; // распознавание уже заменено или снято
          recognition = null;
          if (!isActive(activeCall)) return;

          if (triggered) {
            activeCall.bargeActive = false;
            const text = finalText.trim();
            if (text) {
              activeCall.failures = 0;
              activeCall.uncertain = minConfidence < CONFIDENCE_MIN;
              handleUserTurn(activeCall, text);
            } else {
              activeCall.interrupted = false; // не разобрали, что сказал: слушаем заново
              activeCall.busy = false;
              listen(activeCall);
            }
            return;
          }
          // Chrome закрывает распознавание после паузы: пока Алина говорит, запускаем снова
          if (activeCall.bargeActive && !activeCall.interrupted) {
            setTimeout(() => {
              if (activeCall.bargeActive && !activeCall.interrupted && !recognition && isActive(activeCall)) {
                startBargeIn(activeCall, spokenText);
              }
            }, BARGE_RESTART_DELAY_MS);
          }
        };

        try {
          rec.start();
        } catch (e) {
          activeCall.bargeActive = false;
        }
      }

      async function speak(activeCall, text, { interruptible = true } = {}) {
        const chunks = splitForSpeech(text);
        activeCall.interrupted = false;
        if (interruptible) startBargeIn(activeCall, text);
        try {
          // следующий кусок заказываем заранее, пока играет текущий — без пауз между фразами
          let pending = activeCall.voice === "server" ? fetchSpeech(activeCall, chunks[0]) : null;
          for (let i = 0; i < chunks.length; i++) {
            if (!isActive(activeCall) || activeCall.interrupted) return;
            const buffer = pending ? await pending : null;
            pending = activeCall.voice === "server" && i + 1 < chunks.length ? fetchSpeech(activeCall, chunks[i + 1]) : null;
            if (!isActive(activeCall) || activeCall.interrupted) return;
            if (buffer) await playBuffer(activeCall, buffer);
            else await speakWithBrowser(chunks[i]);
          }
        } finally {
          // договорила сама — барж-распознавание больше не нужно; перебили — оно дослушивает абонента
          if (!activeCall.interrupted) {
            activeCall.bargeActive = false;
            teardownRecognition();
          }
        }
      }

      // --- серверное распознавание ----------------------------------------
      let serverListener = null;

      async function checkServerStt() {
        if (STT_FORCE_BROWSER) return false;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), STATUS_TIMEOUT_MS);
        try {
          const response = await fetch(STT_STATUS_URL, { headers: apiHeaders(), signal: controller.signal });
          return response.ok && (await response.json()).enabled === true;
        } catch (e) {
          return false;
        } finally {
          clearTimeout(timeout);
        }
      }

      // микрофон открываем один раз на звонок: фильтр низких частот + ворота по громкости
      async function ensureMic(activeCall) {
        if (activeCall.mic) return activeCall.mic;
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true, channelCount: 1 },
        });
        if (!isActive(activeCall)) {
          stream.getTracks().forEach((t) => t.stop());
          return null;
        }
        const ctx = activeCall.audio;
        const source = ctx.createMediaStreamSource(stream);
        const highpass = ctx.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 120;
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        const gain = ctx.createGain();
        gain.gain.value = 0;
        const out = ctx.createMediaStreamDestination();
        source.connect(highpass);
        highpass.connect(analyser);
        highpass.connect(gain);
        gain.connect(out);

        const mic = { stream: out.stream, lastLoud: 0, destroy: null };
        const buf = new Float32Array(analyser.fftSize);
        const t0 = performance.now();
        let ambient = 0;
        let threshold = VAD_MIN_LEVEL;
        const timerId = setInterval(() => {
          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (const v of buf) sum += v * v;
          const rms = Math.sqrt(sum / buf.length);
          const now = performance.now();
          const calibrating = now - t0 < VAD_CALIBRATE_MS;
          if (calibrating) {
            ambient = Math.max(ambient, rms);
            threshold = Math.max(VAD_MIN_LEVEL, ambient * VAD_FACTOR);
          } else if (rms > threshold) {
            mic.lastLoud = now;
          }
          const open = !calibrating && now - mic.lastLoud < VAD_HOLD_MS;
          gain.gain.setTargetAtTime(open ? 1 : 0, ctx.currentTime, 0.02);
        }, VAD_POLL_MS);
        mic.destroy = () => {
          clearInterval(timerId);
          stream.getTracks().forEach((t) => t.stop());
        };
        activeCall.mic = mic;
        return mic;
      }

      async function transcribe(activeCall, blob) {
        const response = await fetch(STT_URL, {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm", "X-API-Key": keyInput.value.trim() },
          body: blob,
          signal: activeCall.abort.signal,
        });
        if (!response.ok) throw new Error("stt " + response.status);
        return ((await response.json()).text || "").trim();
      }

      function fallbackToBrowserStt(activeCall) {
        activeCall.stt = "browser";
        showNotice("Серверное распознавание недоступно — слушаю браузером.");
        listen(activeCall);
      }

      function listenServer(activeCall) {
        const mic = activeCall.mic;
        let recorder;
        try {
          recorder = new MediaRecorder(mic.stream);
        } catch (e) {
          fallbackToBrowserStt(activeCall);
          return;
        }
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        const startedAt = performance.now();
        let speechStart = 0;
        let cancelled = false;
        let pollId = null;

        const finish = (send) => {
          clearInterval(pollId);
          serverListener = null;
          recorder.onstop = async () => {
            if (cancelled || !isActive(activeCall)) return;
            if (!send) {
              listen(activeCall);
              return;
            }
            showCaption("Вы", "…");
            setPhase("thinking");
            let text = "";
            try {
              text = await transcribe(activeCall, new Blob(chunks, { type: recorder.mimeType }));
            } catch (e) {
              if (!isActive(activeCall)) return;
              fallbackToBrowserStt(activeCall);
              return;
            }
            if (!isActive(activeCall)) return;
            if (text.length < STT_MIN_CHARS) {
              showCaption("", "");
              listen(activeCall);
              return;
            }
            activeCall.failures = 0;
            activeCall.uncertain = false;
            handleUserTurn(activeCall, text);
          };
          try {
            recorder.stop();
          } catch (e) {}
        };

        pollId = setInterval(() => {
          const now = performance.now();
          if (!speechStart && mic.lastLoud >= startedAt) speechStart = mic.lastLoud;
          if (!speechStart) {
            if (now - startedAt > VAD_IDLE_RESTART_MS) finish(false);
            return;
          }
          const silentFor = now - mic.lastLoud;
          if (silentFor >= VAD_END_SILENCE_MS || now - speechStart > VAD_MAX_UTTERANCE_MS) {
            finish(mic.lastLoud - speechStart >= VAD_MIN_SPEECH_MS);
          }
        }, VAD_POLL_MS);

        serverListener = {
          stop() {
            cancelled = true;
            clearInterval(pollId);
            try {
              recorder.stop();
            } catch (e) {}
          },
        };
        recorder.start();
        setPhase("listening");
      }

      // --- распознавание речи ---------------------------------------------
      function teardownRecognition() {
        if (serverListener) {
          serverListener.stop();
          serverListener = null;
        }
        if (!recognition) return;
        const rec = recognition;
        recognition = null;
        rec.onresult = null;
        rec.onerror = null;
        rec.onend = null;
        try {
          rec.abort();
        } catch (e) {}
      }

      function listen(activeCall) {
        if (!isActive(activeCall) || activeCall.busy) return;
        teardownRecognition();
        if (activeCall.muted) {
          setPhase("listening"); // статус покажет «Микрофон выключен»
          return;
        }
        if (activeCall.stt === "server" && activeCall.mic) {
          listenServer(activeCall);
          return;
        }

        const rec = new SpeechRecognitionImpl();
        rec.lang = "ru-RU";
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;
        recognition = rec;

        let finalText = "";
        let failure = null;
        let minConfidence = 1;

        rec.onresult = (event) => {
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) {
              finalText += result[0].transcript;
              if (result[0].confidence > 0) minConfidence = Math.min(minConfidence, result[0].confidence);
            } else interim += result[0].transcript;
          }
          showCaption("Вы", (finalText + interim).trim());
        };

        rec.onerror = (event) => {
          failure = event.error;
        };

        rec.onend = () => {
          if (rec !== recognition) return; // распознавание уже заменено или снято
          recognition = null;
          if (!isActive(activeCall)) return;

          const text = finalText.trim();
          if (text) {
            activeCall.failures = 0;
            activeCall.uncertain = minConfidence < CONFIDENCE_MIN;
            handleUserTurn(activeCall, text);
            return;
          }
          handleSilentEnd(activeCall, failure);
        };

        setPhase("listening");
        try {
          rec.start();
        } catch (e) {
          handleSilentEnd(activeCall, "start-failed");
        }
      }

      function handleSilentEnd(activeCall, failure) {
        if (failure === "not-allowed" || failure === "service-not-allowed") {
          failCall(activeCall, "Нет доступа к микрофону. Разрешите его для этой страницы и позвоните снова.");
          return;
        }
        if (failure === "audio-capture") {
          failCall(activeCall, "Микрофон не найден. Подключите его и позвоните снова.");
          return;
        }
        const benign = !failure || failure === "no-speech" || failure === "aborted";
        if (!benign) {
          activeCall.failures += 1;
          if (activeCall.failures >= MAX_RECOGNITION_FAILURES) {
            failCall(
              activeCall,
              "Распознавание речи недоступно (" + failure + "). Chrome отправляет звук на сервер Google — проверьте интернет."
            );
            return;
          }
        }
        setTimeout(
          () => listen(activeCall),
          failure === "network" ? NETWORK_RETRY_DELAY_MS : LISTEN_RETRY_DELAY_MS
        );
      }

      // --- обмен с агентом ------------------------------------------------
      async function requestAgent(activeCall, text) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        const spoken = activeCall.uncertain ? UNCERTAIN_MARK + text : text;
        activeCall.uncertain = false;
        storeSet("mts_api_key", keyInput.value.trim());
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: apiHeaders(),
            body: JSON.stringify({
              session_id: activeCall.sessionId,
              caller_phone: CALLER_PHONE,
              user_message: spoken,
              model_profile: modelProfile,
            }),
            signal: controller.signal,
          });
          if (response.status === 401) return { fatal: "Неверный API-ключ (X-API-Key)." };
          if (!response.ok) {
            const detail = ((await response.json().catch(() => ({}))).detail || {}).error || {};
            return { reply: FALLBACK_REPLY, failed: true, fatal: FATAL_AGENT_ERRORS[detail.code] || null };
          }
          const data = await response.json();
          return { reply: data.agent_response || FALLBACK_REPLY, transfer: data.transfer || null, chat: data.chat || [], links: data.links || [] };
        } catch (e) {
          return { reply: FALLBACK_REPLY, failed: true };
        } finally {
          clearTimeout(timeout);
        }
      }

      async function handleUserTurn(activeCall, text) {
        activeCall.busy = true; // пока агент думает и говорит, микрофон не слушаем
        teardownRecognition();
        showCaption("Вы", text);
        addMessage("user", text);
        setPhase("thinking");

        const result = await requestAgent(activeCall, text);
        if (!isActive(activeCall)) return;
        if (result.fatal) {
          failCall(activeCall, result.fatal);
          return;
        }

        activeCall.agentFailures = result.failed ? activeCall.agentFailures + 1 : 0;
        if (activeCall.agentFailures >= MAX_AGENT_FAILURES) {
          failCall(activeCall, "Агент не отвечает. Облако: проверьте баланс Polza. Локальная модель: проверьте, что сервер запущен.");
          return;
        }

        addMessage("agent", result.reply);
        (result.chat || []).forEach((extra) => addMessage("agent", extra));
        addLinks(result.links || []);
        showCaption("Алина", result.reply);
        setPhase("speaking");
        await speak(activeCall, result.reply, { interruptible: !result.transfer });
        if (!isActive(activeCall)) return;
        if (activeCall.interrupted) {
          activeCall.interrupted = false; // абонент перебил: его фразу уже дослушивает распознавание
          return;
        }

        if (result.transfer) {
          const dept = result.transfer.department || "профильного специалиста";
          finishCall(activeCall, "Переводим вас на отдел: " + dept);
          return;
        }

        activeCall.busy = false;
        await sleep(LISTEN_RESUME_DELAY_MS);
        listen(activeCall);
      }

      // --- жизненный цикл звонка -----------------------------------------
      function newSessionId() {
        return window.crypto && crypto.randomUUID ? crypto.randomUUID() : "call-" + Date.now();
      }

      async function startCall() {
        if (call || !checkEnvironment()) return;
        const activeCall = {
          sessionId: widgetSessionId,
          muted: false,
          busy: true,
          ended: false,
          failures: 0,
          agentFailures: 0,
          startedAt: 0,
          timerId: null,
          voice: "browser",
          abort: new AbortController(),
          audio: null,
          analyser: null,
          source: null,
        };
        call = activeCall;
        modelSelect.disabled = true; // модель нельзя менять посреди разговора

        // AudioContext создаём сразу в обработчике клика — иначе браузер не даст играть звук
        if (AudioContextImpl) {
          activeCall.audio = new AudioContextImpl();
          activeCall.audio.resume();
          activeCall.analyser = activeCall.audio.createAnalyser();
          activeCall.analyser.fftSize = 256;
        }

        timerEl.textContent = "";
        showCaption("", "");
        showNotice("");
        setMuted(false);
        setPhase("connecting");

        const [serverVoice, serverStt] = await Promise.all([
          checkServerVoice(),
          checkServerStt(),
          sleep(CONNECT_DELAY_MS), // имитация дозвона
        ]);
        if (!isActive(activeCall)) return;
        if (serverVoice && activeCall.audio) activeCall.voice = "server";
        activeCall.stt = "browser";
        if (serverStt && activeCall.audio && window.MediaRecorder && navigator.mediaDevices) {
          try {
            if (await ensureMic(activeCall)) activeCall.stt = "server";
          } catch (e) {
            if (e && e.name === "NotAllowedError") {
              failCall(activeCall, "Нет доступа к микрофону. Разрешите его для этой страницы и позвоните снова.");
              return;
            }
          }
          if (!isActive(activeCall)) return;
        }

        startTimer(activeCall);
        showCaption("Алина", GREETING);
        setPhase("speaking");
        await speak(activeCall, GREETING);
        if (!isActive(activeCall)) return;
        if (activeCall.interrupted) {
          activeCall.interrupted = false; // перебили приветствие
          return;
        }

        activeCall.busy = false;
        await sleep(LISTEN_RESUME_DELAY_MS);
        listen(activeCall);
      }

      function teardownCall(activeCall) {
        activeCall.ended = true;
        clearInterval(activeCall.timerId);
        activeCall.abort.abort();
        teardownRecognition();
        if (activeCall.mic) activeCall.mic.destroy();
        if (activeCall.source) {
          try {
            activeCall.source.stop();
          } catch (e) {}
        }
        if (activeCall.audio) activeCall.audio.close().catch(() => {});
        if (synth) synth.cancel();
        setLevel(0);
        widget.dataset.level = "sim";
      }

      function finishCall(activeCall, message) {
        const seconds = activeCall.startedAt ? Math.floor((Date.now() - activeCall.startedAt) / 1000) : 0;
        teardownCall(activeCall);
        call = null;
        modelSelect.disabled = false;
        setPhase("ended");
        statusEl.textContent = message || STATUS_TEXT.ended;
        timerEl.textContent = seconds ? "Длительность " + formatDuration(seconds) : "";
      }

      function failCall(activeCall, message) {
        finishCall(activeCall, "Звонок прерван");
        showNotice(message);
      }

      // --- микрофон -------------------------------------------------------
      function setMuted(muted) {
        if (call) call.muted = muted;
        widget.dataset.muted = String(muted);
        muteBtn.setAttribute("aria-pressed", String(muted));
        muteBtn.setAttribute("aria-label", muted ? "Включить микрофон" : "Выключить микрофон");
      }

      function toggleMute() {
        if (!call) return;
        const muted = !call.muted;
        setMuted(muted);
        if (muted) {
          teardownRecognition();
          if (widget.dataset.phase === "listening") setPhase("listening");
        } else if (!call.busy) {
          listen(call);
        }
      }

      // --- текстовые сообщения --------------------------------------------
      const composer = $("composer");
      const textInput = $("textInput");

      async function submitText() {
        const text = textInput.value.trim();
        if (!text) return;
        if (call && (call.busy || call.ended)) {
          showNotice("Алина отвечает, напишите через секунду.");
          setTimeout(() => showNotice(""), 2500);
          return;
        }
        textInput.value = "";
        showNotice("");
        if (call) {
          handleUserTurn(call, text); // во время звонка текст идёт как обычная реплика, ответ озвучивается
          return;
        }
        addMessage("user", text);
        const pending = addMessage("agent", "…");
        pending.classList.add("pending");
        const result = await requestAgent({ sessionId: widgetSessionId, uncertain: false }, text);
        pending.remove();
        if (result.fatal) {
          showNotice(result.fatal);
          return;
        }
        addMessage("agent", result.reply);
        (result.chat || []).forEach((extra) => addMessage("agent", extra));
        addLinks(result.links || []);
      }

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        submitText();
      });

      // --- события --------------------------------------------------------
      $("launcher").addEventListener("click", () => setOpen(true));
      $("minimizeBtn").addEventListener("click", () => setOpen(false));
      settingsBtn.addEventListener("click", () => {
        const open = settingsEl.hidden;
        settingsEl.hidden = !open;
        settingsBtn.setAttribute("aria-expanded", String(open));
      });
      startBtn.addEventListener("click", startCall);
      endBtn.addEventListener("click", () => {
        if (call) finishCall(call);
      });
      muteBtn.addEventListener("click", toggleMute);
      window.addEventListener("beforeunload", () => {
        if (synth) synth.cancel();
      });

      // встроенный режим: сообщаем странице-хозяину размер виджета и слушаем команду «открыть»
      if (EMBED) {
        const reportSize = () => {
          const box = widget.getBoundingClientRect();
          parent.postMessage({ type: "mts-agent-size", width: Math.ceil(box.width) + 80, height: Math.ceil(box.height) + 80 }, "*");
        };
        new ResizeObserver(reportSize).observe(widget);
        window.addEventListener("message", (event) => {
          if (event.source === parent && event.data && event.data.type === "mts-agent-open") setOpen(true);
        });
        reportSize();
      }

      checkEnvironment();
      loadTenant();
      checkServerVoice();
      checkModels();
    </script>
  </body>
</html>
