<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КлиматПлюс · Симулятор звонка</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #142523; background: #f1f6f4; }
    body { margin: 0 auto; max-width: 1040px; padding: 28px 20px; }
    main { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; }
    section { padding: 20px; border: 1px solid #cadaD5; border-radius: 14px; background: white; }
    h1, h2 { margin: 0 0 12px; }
    button, input { font: inherit; padding: 8px 12px; border-radius: 7px; border: 1px solid #849b94; }
    button { background: #12654f; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    input { box-sizing: border-box; width: 100%; }
    form { display: flex; gap: 8px; margin: 12px 0; }
    ol { min-height: 100px; max-height: 55vh; overflow: auto; padding: 0 0 0 23px; }
    li { margin-bottom: 9px; padding-left: 3px; }
    dl { display: grid; grid-template-columns: 110px 1fr; gap: 5px 12px; }
    dt { font-weight: 650; }
    dd { margin: 0; }
    details { margin: 12px 0; }
    #status { min-height: 1.5em; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 680px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>КлиматПлюс</h1>
    <p>Симулятор звонка. Вводите реплики абонента текстом.</p>
    <details><summary>Ключ доступа к стенду</summary><input id="key" type="password" aria-label="Ключ API" value="test-local-key"></details>
    <p id="status" role="status"></p>
  </header>
  <main>
    <section>
      <h2>Разговор</h2>
      <div class="actions">
        <button id="start">Входящий звонок</button>
        <button id="finish" disabled>Завершить</button>
      </div>
      <ol id="history" aria-label="История разговора"></ol>
      <form id="turn">
        <input id="text" aria-label="Реплика абонента" maxlength="2000" required>
        <button id="send" disabled>Сказать</button>
      </form>
      <label><input id="interrupt" type="checkbox" style="width:auto"> Перебить ответ</label>
    </section>
    <section>
      <h2>Карточка менеджера</h2>
      <div id="card"><p>Появится после завершения или перевода.</p></div>
      <div class="actions">
        <button id="queue" disabled>Назначить обратный звонок</button>
        <button id="connect" disabled>Поднять трубку</button>
      </div>
      <p id="job" role="status"></p>
    </section>
  </main>
  <script>
    const get = id => document.getElementById(id);
    let call, job, busy = false;
    const labels = {
      need: "Потребность", budget_byn: "Бюджет, BYN", days: "Срок, дней", authority: "Согласование",
      appointment: "Визит", category: "Категория", reason: "Причина", next_step: "Следующий шаг"
    };
    async function api(path, body) {
      const response = await fetch("/api" + path, {
        method: body === undefined ? "GET" : "POST",
        headers: {"X-API-Key": get("key").value, "Content-Type": "application/json"},
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === "string" ? result.detail : "Запрос не выполнен");
      return result;
    }
    function render() {
      const open = call?.status === "ongoing";
      get("start").disabled = busy;
      get("finish").disabled = busy || !open;
      get("send").disabled = busy || !open;
      get("queue").disabled = busy || !call?.card || !!job;
      get("connect").disabled = busy || job?.status !== "finished" || job?.outcome !== "answered";
      get("history").replaceChildren(...(call?.history || []).map(turn => {
        const li = document.createElement("li");
        li.textContent = (turn.role === "user" ? "Абонент: " : "Вера: ") + turn.text;
        return li;
      }));
      get("history").scrollTop = get("history").scrollHeight;
      if (call?.card) {
        const details = document.createElement("dl");
        for (const [key, label] of Object.entries(labels)) {
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = key === "appointment" ? call.card.appointment?.slot ?? "Не назначен" : call.card[key] ?? "Не указано";
          details.append(dt, dd);
        }
        get("card").replaceChildren(details);
      } else {
        get("card").textContent = "Появится после завершения или перевода.";
      }
      const outcomes = {answered: "Абонент ответил", busy: "Линия занята", no_answer: "Нет ответа"};
      get("job").textContent = job ? (outcomes[job.outcome] || "В очереди") + " · попыток: " + job.attempts : "";
    }
    async function act(operation) {
      if (busy) return;
      busy = true;
      render();
      try {
        await operation();
        get("status").textContent = call?.status === "transferred" ? "Звонок передан менеджеру в симуляторе." : "";
      } catch (error) {
        get("status").textContent = error.message;
      } finally {
        busy = false;
        render();
      }
    }
    get("start").onclick = () => act(async () => {
      call = await api("/simulator/calls", {});
      job = null;
      get("text").focus();
    });
    get("turn").onsubmit = event => {
      event.preventDefault();
      act(async () => {
        const text = get("text").value.trim();
        if (!text) return;
        const heard = get("interrupt").checked ? call.history.at(-1).text.split(" ").slice(0, 3).join(" ") : null;
        call = await api(`/simulator/calls/${call.call_id}/turn`, {text, heard});
        get("text").value = "";
        get("interrupt").checked = false;
      });
    };
    get("finish").onclick = () => act(async () => {
      call = await api(`/simulator/calls/${call.call_id}/finish`, {});
    });
    get("queue").onclick = () => act(async () => {
      job = await api("/callbacks", {source_call_id: call.call_id, request_id: "demo-" + call.call_id});
    });
    get("connect").onclick = () => act(async () => {
      call = await api(`/simulator/callbacks/${job.id}/connect`, {});
      job = null;
    });
    setInterval(() => {
      if (!busy && job && job.status !== "finished") {
        act(async () => { job = await api("/callbacks/" + job.id); });
      }
    }, 1000);
    render();
  </script>
</body>
</html>
