<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>История звонка</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        color: #222;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 32px;
        max-width: 560px;
        width: 100%;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }
      h1 { font-size: 22px; margin-bottom: 8px; }
      .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
      .row { display: flex; gap: 8px; margin-bottom: 18px; }
      input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        background: #e30611;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #status { font-size: 14px; color: #a52a1e; margin-bottom: 12px; }
      .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
      .msg.user { background: #f0f0f0; }
      .msg.agent { background: #fdecea; }
      .msg .role { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 4px; display: block; }
      nav { font-size: 13px; margin-bottom: 20px; }
      nav a { color: #e30611; text-decoration: none; margin-right: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <nav>
        <a href="/demo/">Чат</a>
        <a href="/demo/connect.html">Подключение</a>
      </nav>
      <h1>История звонка</h1>
      <p class="sub">Показывает реплики клиента и агента по session_id. Технические вызовы инструментов не отображаются.</p>
      <div class="row">
        <input id="sessionId" type="text" placeholder="session_id" />
        <button onclick="loadHistory()">Показать</button>
      </div>
      <div id="status"></div>
      <div id="messages"></div>
    </div>

    <script>
      document.getElementById("sessionId").value = sessionStorage.getItem("mts_last_session_id") || "";

      function textFromContent(content) {
        if (typeof content === "string") return content;
        if (Array.isArray(content)) {
          return content
            .filter((b) => b && b.type === "text")
            .map((b) => b.text)
            .join(" ");
        }
        return "";
      }

      async function loadHistory() {
        const sessionId = document.getElementById("sessionId").value.trim();
        const apiKey = sessionStorage.getItem("mts_api_key") || "";
        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("messages");
        statusEl.textContent = "";
        listEl.innerHTML = "";

        if (!sessionId) {
          statusEl.textContent = "Введите session_id.";
          return;
        }

        let response;
        try {
          response = await fetch(`/api/hermes/dialog/${encodeURIComponent(sessionId)}/history`, {
            headers: { "X-API-Key": apiKey },
          });
        } catch (e) {
          statusEl.textContent = "Сервер недоступен.";
          return;
        }

        if (response.status === 404) {
          statusEl.textContent = "Сессия не найдена или истекла.";
          return;
        }
        if (response.status === 401) {
          statusEl.textContent = "Неверный API-ключ.";
          return;
        }
        if (!response.ok) {
          statusEl.textContent = "Агент временно недоступен.";
          return;
        }

        const data = await response.json();
        (data.messages || []).forEach((m) => {
          const text = textFromContent(m.content);
          if (!text.trim()) return;
          const el = document.createElement("div");
          el.className = "msg " + (m.role === "user" ? "user" : "agent");
          el.innerHTML = `<span class="role">${m.role === "user" ? "Клиент" : "Агент"}</span>`;
          el.appendChild(document.createTextNode(text));
          listEl.appendChild(el);
        });

        if (!listEl.childElementCount) {
          statusEl.textContent = "В истории нет текстовых реплик.";
        }
      }
    </script>
  </body>
</html>
