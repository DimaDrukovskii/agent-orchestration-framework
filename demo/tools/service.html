<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контроль обращений</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f4f6f8,#14181e);color:light-dark(#182330,#edf0f4)}
*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:24px}a{color:light-dark(#155a99,#9bcbff)}h1{font-size:26px;margin:20px 0 8px}h2{font-size:20px}p{line-height:1.5}form,.toolbar,.metrics{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px}input,select,textarea,button{font:inherit;color:inherit;background:light-dark(#fff,#222b36);border:1px solid light-dark(#b7c1cd,#647286);border-radius:8px;padding:10px}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}input{max-width:100%}textarea{width:100%;min-height:100px}section{margin-top:24px}.metrics span{padding:12px 0;margin-right:16px}#notice{min-height:24px;white-space:pre-wrap}#notice[data-error="true"]{color:light-dark(#a3291a,#ffb3a7)}.request{border-top:1px solid light-dark(#ccd3dc,#46515f);padding:18px 0;display:grid;gap:10px}.request h3{font-size:18px;margin:0}.request p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}dialog{width:min(720px,95%);max-height:85vh;overflow:auto;border:1px solid light-dark(#b7c1cd,#647286);border-radius:12px;color:inherit;background:light-dark(#fff,#222b36)}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.5}summary{cursor:pointer;padding:10px 0}small{opacity:.8}#deliveries{white-space:pre-wrap}.pager{display:flex;gap:12px;align-items:center;margin-top:16px}
</style>
</head>
<body>
<a href="/demo/tools/live.html">Линия менеджера</a> · <a href="/demo/call.html">К консультанту</a> · <a href="/demo/tools/architecture.html">Логика проекта</a>
<h1>Контроль обращений</h1>
<p>Уведомление не закрывает заявку. Менеджер принимает её в работу и фиксирует результат.</p>
<form id="access"><label>Ключ доступа<input id="key" type="password" required autocomplete="off"></label><label>Ваше имя<input id="manager" required maxlength="100" autocomplete="name"></label><button>Открыть обращения</button></form>
<p id="notice" role="status" aria-live="polite"></p>
<main id="workspace" hidden>
<div class="metrics" id="counts"></div>
<div class="toolbar"><label>Показать<select id="filter"><option value="open">Все открытые</option><option value="new">Новые</option><option value="in_progress">В работе</option><option value="completed">Завершённые</option></select></label><button id="refresh">Обновить</button><button id="logout">Закрыть доступ</button></div>
<section><h2>Заявки</h2><div id="requests"></div><div class="pager"><button id="prev">Назад</button><span id="page"></span><button id="next">Далее</button></div></section>
<section><h2>Доставка уведомлений</h2><p id="deliveries"></p><small>Если канал недоступен, заявки остаются в списке. Отправка будет повторена автоматически.</small></section>
</main>
<dialog id="detail"><p id="detail-notice" role="status" aria-live="polite"></p><h2 id="detail-title">Обращение</h2><div id="history"></div><form id="completion"><label>Результат обработки<textarea id="result" required maxlength="2000" placeholder="Что согласовано с клиентом и как решён его запрос"></textarea></label><button>Завершить заявку</button></form><button id="close-detail">Закрыть</button></dialog>
<script>
(()=>{
const $=id=>document.getElementById(id), labels={new:'Новая',in_progress:'В работе',completed:'Завершена'},fieldLabels={name:'Имя',need:'Запрос',budget:'Бюджет',urgency:'Сроки',contact_phone:'Контакт',comment:'Комментарий'};
let secret='',manager='',offset=0,selected=null,loading=false,epoch=0;
function notice(text,error=false){$('notice').textContent=text;$('notice').dataset.error=String(error);$('detail-notice').textContent=error?text:''}
async function api(path,body){const response=await fetch('/api/service/'+path,{method:body?'POST':'GET',headers:{'X-API-Key':secret,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw new Error(response.status===401?'Проверьте ключ доступа.':typeof data.detail==='string'?data.detail:'Не удалось выполнить действие. Обновите список и повторите.');return data}
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function action(text,fn){const b=element('button',text);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){notice(e.message,true)}finally{b.disabled=false}};return b}
async function detail(item){const token=epoch;const data=await api('requests/'+encodeURIComponent(item.call_id));if(token!==epoch||!secret)return;selected=data;$('detail-notice').textContent='';$('detail-title').textContent='Обращение '+item.call_id;$('history').replaceChildren();$('history').append(element('p',(item.need||'Запрос на разговор с менеджером')+' · '+(item.contact_phone||'Контакт не указан')));for(const event of data.events)$('history').append(element('p',new Date(event.created_at*1000).toLocaleString('ru-RU')+' · '+labels[event.status]+(event.manager?' · '+event.manager:'')+(event.result?' · '+event.result:'')));
const transcript=element('details','');transcript.append(element('summary','Разговор'),element('pre',data.transcript||'Текст разговора отсутствует'));$('history').append(transcript);
const revisions=element('details','');revisions.append(element('summary','История изменений карточки'));for(const revision of data.revisions){const fields=JSON.parse(revision.card_json);revisions.append(element('pre',Object.entries(fields).filter(([k,v])=>v&& !['id','call_id','created_at'].includes(k)).map(([k,v])=>(fieldLabels[k]||k)+': '+v).join('\n')))}$('history').append(revisions);$('result').value='';$('completion').hidden=!(data.status==='in_progress'&&data.assigned_to===manager);$('detail').showModal()}
async function refresh(){if(loading||!secret)return;loading=true;const token=epoch;try{const [data,delivery]=await Promise.all([api('requests?status='+$('filter').value+'&offset='+offset),api('deliveries')]);if(token!==epoch||!secret)return;$('workspace').hidden=false;$('counts').replaceChildren();for(const [status,count]of Object.entries(data.counts))$('counts').append(element('span',labels[status]+': '+count));$('requests').replaceChildren();for(const item of data.items){const row=element('article','');row.className='request';row.append(element('h3',(item.name||'Клиент')+' · '+labels[item.status]),element('small',new Date(item.created_at*1000).toLocaleString('ru-RU')+' · '+item.call_id),element('p',item.need||'Запрос на разговор с менеджером'),element('p','Контакт: '+(item.contact_phone||'не указан')+(item.assigned_to?' · Менеджер: '+item.assigned_to:'')));if(item.comment)row.append(element('p',item.comment));const actions=element('div','');actions.className='actions';if(item.status==='new')actions.append(action('Взять в работу',async()=>{await api('requests/'+encodeURIComponent(item.call_id)+'/claim',{manager});await refresh();notice('Заявка закреплена за вами.')}));actions.append(action('Открыть',()=>detail(item)));row.append(actions);$('requests').append(row)}if(!data.items.length)$('requests').append(element('p','В этой группе заявок нет.'));$('page').textContent=data.total?`${offset+1}–${offset+data.items.length} из ${data.total}`:'0 заявок';$('prev').disabled=offset===0;$('next').disabled=!data.has_more;
const queued=delivery.counts.pending+delivery.counts.sending;$('deliveries').textContent=(delivery.configured?'Канал настроен.':'Канал уведомлений не настроен. Укажите получателя и доступ к Telegram на сервере.')+` Ожидают доставки: ${queued}. Доставлены: ${delivery.counts.delivered}.`+(queued?` Самое старое ожидает ${Math.ceil(delivery.oldest_pending_seconds/60)} мин.`:'');notice('Обновлено '+new Date().toLocaleTimeString('ru-RU'));}catch(e){notice(e.message,true)}finally{loading=false}}
$('access').onsubmit=e=>{e.preventDefault();epoch++;secret=$('key').value.trim();manager=$('manager').value.trim();if(!manager)return notice('Укажите ваше имя.',true);$('key').value='';offset=0;refresh()};$('refresh').onclick=refresh;$('filter').onchange=()=>{offset=0;refresh()};$('prev').onclick=()=>{offset=Math.max(0,offset-200);refresh()};$('next').onclick=()=>{offset+=200;refresh()};$('close-detail').onclick=()=>$('detail').close();$('logout').onclick=()=>{epoch++;secret='';manager='';selected=null;$('workspace').hidden=true;$('requests').replaceChildren();$('history').replaceChildren();$('detail').close();notice('Доступ закрыт.')};$('completion').onsubmit=async e=>{e.preventDefault();const result=$('result').value.trim();if(!result)return;const button=$('completion').querySelector('button');button.disabled=true;try{await api('requests/'+encodeURIComponent(selected.call_id)+'/complete',{manager,result});$('detail').close();await refresh();notice('Результат сохранён. Заявка завершена.')}catch(error){notice(error.message,true)}finally{button.disabled=false}};
})();
</script>
</body></html>
